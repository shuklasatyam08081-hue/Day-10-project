<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Table</title>
</head>
<body>
  <h1>Product List</h1>
  <table border="1" cellpadding="8">
    <caption>Store Inventory</caption>
    <thead>
      <tr>
        <th>Product</th>
        <th>Price (₹)</th>
        <th>Stock</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>Keyboard</td><td>799</td><td>25</td></tr>
      <tr><td>Mouse</td><td>399</td><td>40</td></tr>
      <tr><td>Monitor</td><td>8999</td><td>10</td></tr>
      <tr><td>CPU</td><td>14999</td><td>5</td></tr>
      <tr><td>Headphones</td><td>1999</td><td>15</td></tr>
      <tr><td>Webcam</td><td>2499</td><td>20</td></tr>
      <tr><td>Speakers</td><td>2999</td><td>12</td></tr>
    </tbody>
    <tfoot>
      <tr><td colspan="2">Total items</td><td>75</td></tr>
    </tfoot>
  </table>
</body>
</html>
